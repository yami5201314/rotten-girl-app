[package]
name = "rotten-girl-app"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "rotten_girl_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# 生产包从内置资源加载页面，不连开发服务器；tauri build 与 scripts/ios-unsigned.sh 传入
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# TLS 用 ring + webpki-roots 预配置：避开 aws-lc-rs 的 Android 交叉编译（cmake/NASM）与 platform-verifier 的 JNI 初始化
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "cookies", "json", "http2", "charset"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
reqwest_cookie_store = "0.10"
cookie_store = "0.22"
url = "2"
http = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
