# 公开仓库只做框架验证：使用占位站点地址（app.config.example.json），产物不发布、不签名。
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: git diff --check HEAD^ HEAD || git diff --check
      # 防止真实地址、私网 IP、密钥误入公开仓库
      - name: secret scan
        run: |
          if git grep -nIE '(^|[^0-9])(10\.[0-9]+\.[0-9]+\.[0-9]+|192\.168\.[0-9]+\.[0-9]+|172\.(1[6-9]|2[0-9]|3[01])\.[0-9]+\.[0-9]+)([^0-9]|$)|BEGIN [A-Z ]*PRIVATE KEY|ghp_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}' -- ':!pnpm-lock.yaml' ':!src-tauri/Cargo.lock'; then
            echo '::error::发现疑似私网地址或密钥'; exit 1
          fi

  android:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # ubuntu runner 已预装 Android SDK 与 NDK（ANDROID_HOME / ANDROID_NDK_LATEST_HOME）
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      # env 上下文读不到 runner 的系统变量，在 shell 里取预装 NDK
      - run: |
          export NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_HOME/ndk/$(ls "$ANDROID_HOME/ndk" | sort -V | tail -n1)}"
          echo "NDK_HOME=$NDK_HOME"
          pnpm tauri android build --apk --target aarch64 --target x86_64

  ios:
    needs: web
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      # iOS 工程未入库，CI 现生成；只验证能编译出未签名 IPA，公开仓库不上传产物
      - run: pnpm tauri ios init --ci
      - run: bash scripts/ios-unsigned.sh build/rotten-girl-ios-unsigned.ipa
